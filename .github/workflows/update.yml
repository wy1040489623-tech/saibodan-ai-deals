name: Update daily AI deals

on:
  schedule:
    # 09:10 Asia/Shanghai (UTC+8) = 01:10 UTC
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull latest snapshot from saibodan.com
        run: node scripts/update.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md DEALS.md data
          git commit -m "chore: update daily AI deals"
          git push
